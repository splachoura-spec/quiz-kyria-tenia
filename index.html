<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Πόσο καλά ξέρεις την κυρία Τένια;</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --pink:#FF6B9D;--pink-light:#FFA5C4;--pink-dark:#E8558A;
  --teal:#1B8E6B;--teal-dark:#15705A;--teal-light:#24B888;
  --yellow:#FFD93D;--dark:#1a1a2e;--white:#fff;
  --correct:#2ecc71;--wrong:#e74c3c;
}
body{font-family:'Nunito',sans-serif;background:var(--pink);min-height:100dvh;overflow-x:hidden;color:var(--dark)}
.screen{display:none;min-height:100dvh;padding:20px;animation:fadeIn .4s ease}
.screen.active{display:flex;flex-direction:column;align-items:center;justify-content:center}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-15px) rotate(5deg)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}
@keyframes confettiFall{0%{transform:translateY(-100vh) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes starFloat{0%{transform:translateY(0) rotate(0deg);opacity:.7}50%{transform:translateY(-20px) rotate(180deg);opacity:1}100%{transform:translateY(0) rotate(360deg);opacity:.7}}

.floating-deco{position:fixed;pointer-events:none;z-index:0;font-size:24px}
.fd1{top:10%;left:5%;animation:starFloat 4s infinite}
.fd2{top:20%;right:8%;animation:starFloat 3.5s infinite .5s}
.fd3{top:50%;left:3%;animation:starFloat 5s infinite 1s}
.fd4{top:70%;right:5%;animation:starFloat 4.5s infinite 1.5s}
.fd5{top:85%;left:10%;animation:starFloat 3s infinite 2s}
.fd6{top:5%;right:30%;animation:starFloat 6s infinite .8s}
.fd7{top:40%;right:2%;animation:starFloat 4s infinite 2.5s}
.fd8{bottom:15%;right:15%;animation:starFloat 5.5s infinite 1.2s}

#welcome{background:var(--pink);text-align:center}
.welcome-card{background:var(--white);border-radius:30px;padding:40px 30px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.15);position:relative;z-index:1}
.welcome-emoji{font-size:60px;margin-bottom:10px;animation:float 3s ease-in-out infinite}
.welcome-title{font-size:28px;font-weight:900;color:var(--teal);line-height:1.2;margin-bottom:5px}
.welcome-subtitle{font-size:15px;color:#888;margin-bottom:25px;font-weight:600}
.name-input{width:100%;padding:16px 20px;border:3px solid var(--pink-light);border-radius:16px;font-size:18px;font-family:'Nunito',sans-serif;font-weight:700;text-align:center;outline:none;transition:all .3s;background:var(--white)}
.name-input:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(27,142,107,.15)}
.name-input::placeholder{color:#ccc;font-weight:600}
.btn-start{margin-top:20px;width:100%;padding:18px;background:var(--dark);color:var(--white);border:none;border-radius:16px;font-size:20px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;transition:all .3s;letter-spacing:1px}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.3)}
.btn-start:active{transform:translateY(0)}
.btn-start:disabled{opacity:.5;cursor:not-allowed;transform:none}

#quiz{background:var(--teal);padding:20px;position:relative}
.quiz-header{width:100%;max-width:500px;margin-bottom:20px}
.quiz-progress-bar{width:100%;height:10px;background:rgba(255,255,255,.2);border-radius:10px;overflow:hidden;margin-bottom:10px}
.quiz-progress-fill{height:100%;background:var(--yellow);border-radius:10px;transition:width .4s ease}
.quiz-counter{color:var(--white);font-weight:700;font-size:14px;text-align:right;opacity:.8}
.quiz-card{background:var(--white);border-radius:24px;padding:35px 25px 30px;max-width:500px;width:100%;box-shadow:0 15px 50px rgba(0,0,0,.2);position:relative}
.quiz-card.slide-in{animation:slideInRight .4s ease}
.question-emoji{font-size:40px;text-align:center;margin-bottom:12px}
.question-text{font-size:20px;font-weight:800;color:var(--dark);text-align:center;line-height:1.4;margin-bottom:25px}
.options-grid{display:flex;flex-direction:column;gap:12px}
.option-btn{width:100%;padding:16px 20px;background:var(--pink);color:var(--white);border:none;border-radius:14px;font-size:17px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;transition:all .2s;text-align:left;position:relative;overflow:hidden}
.option-btn:hover{transform:translateX(5px);box-shadow:0 4px 15px rgba(255,107,157,.4)}
.option-btn:active{transform:scale(.97)}
.option-btn.correct{background:var(--correct)!important;animation:bounce .5s ease}
.option-btn.wrong{background:var(--wrong)!important;animation:shake .5s ease}
.option-btn.reveal{background:var(--correct)!important;opacity:.7}
.option-btn.disabled{pointer-events:none;opacity:.7}
.option-label{display:inline-block;width:30px;height:30px;background:rgba(255,255,255,.25);border-radius:8px;text-align:center;line-height:30px;margin-right:10px;font-weight:800;font-size:14px}
.streak-badge{position:absolute;top:-10px;right:15px;background:var(--yellow);color:var(--dark);padding:5px 12px;border-radius:20px;font-size:14px;font-weight:800;animation:popIn .3s ease;display:none;z-index:2}
.streak-badge.show{display:block}

#results{background:linear-gradient(135deg,var(--pink) 0%,var(--teal) 100%);text-align:center}
.results-card{background:var(--white);border-radius:30px;padding:40px 30px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2);position:relative;z-index:1;animation:popIn .5s ease}
.results-emoji{font-size:70px;margin-bottom:10px}
.results-title{font-size:24px;font-weight:900;color:var(--teal);margin-bottom:5px}
.results-name{font-size:18px;color:var(--pink);font-weight:700;margin-bottom:20px}
.score-circle{width:140px;height:140px;border-radius:50%;background:var(--teal);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 8px 30px rgba(27,142,107,.3)}
.score-number{font-size:48px;font-weight:900;color:var(--white);line-height:1}
.score-total{font-size:16px;color:rgba(255,255,255,.7);font-weight:700}
.results-message{font-size:16px;font-weight:700;color:var(--dark);background:var(--pink-light);padding:12px 20px;border-radius:12px;margin-bottom:20px;line-height:1.4}
.results-saved{font-size:13px;color:#888;font-weight:600}
.btn-leaderboard{margin-top:15px;padding:14px 28px;background:var(--teal);color:var(--white);border:none;border-radius:14px;font-size:16px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;transition:all .3s}
.btn-leaderboard:hover{background:var(--teal-dark);transform:translateY(-2px)}

#leaderboard{background:var(--dark);min-height:100dvh;padding:30px 20px}
.lb-header{text-align:center;margin-bottom:30px}
.lb-title{font-size:28px;font-weight:900;color:var(--yellow);margin-bottom:5px}
.lb-subtitle{font-size:15px;color:rgba(255,255,255,.5);font-weight:600}
.lb-list{max-width:500px;width:100%;margin:0 auto}
.lb-item{display:flex;align-items:center;background:rgba(255,255,255,.08);border-radius:16px;padding:14px 18px;margin-bottom:10px;transition:all .3s;animation:slideInRight .4s ease backwards}
.lb-item:nth-child(1){background:linear-gradient(135deg,rgba(255,215,0,.2),rgba(255,215,0,.05));border:2px solid rgba(255,215,0,.3)}
.lb-item:nth-child(2){background:linear-gradient(135deg,rgba(192,192,192,.15),rgba(192,192,192,.05));border:2px solid rgba(192,192,192,.2)}
.lb-item:nth-child(3){background:linear-gradient(135deg,rgba(205,127,50,.15),rgba(205,127,50,.05));border:2px solid rgba(205,127,50,.2)}
.lb-rank{font-size:24px;margin-right:14px;min-width:35px;text-align:center}
.lb-name{flex:1;color:var(--white);font-weight:700;font-size:17px}
.lb-score{color:var(--yellow);font-weight:800;font-size:18px;background:rgba(255,217,61,.1);padding:6px 14px;border-radius:10px}
.lb-empty{text-align:center;color:rgba(255,255,255,.4);font-size:16px;font-weight:600;padding:40px}
.btn-refresh{margin:20px auto 0;display:block;padding:12px 24px;background:var(--teal);color:var(--white);border:none;border-radius:12px;font-size:15px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;transition:all .3s}
.btn-refresh:hover{background:var(--teal-light)}
.btn-back{margin:15px auto 0;display:block;padding:10px 20px;background:transparent;color:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.15);border-radius:12px;font-size:14px;font-weight:600;font-family:'Nunito',sans-serif;cursor:pointer}

.confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;overflow:hidden}
.confetti-piece{position:absolute;width:10px;height:10px;top:-10px;animation:confettiFall linear forwards}

@media(max-width:420px){
  .welcome-card,.quiz-card,.results-card{padding:30px 20px}
  .welcome-title{font-size:24px}
  .question-text{font-size:18px}
  .option-btn{font-size:15px;padding:14px 16px}
  .score-circle{width:120px;height:120px}
  .score-number{font-size:40px}
}
</style>
</head>
<body>

<div class="floating-deco fd1">⭐</div>
<div class="floating-deco fd2">✨</div>
<div class="floating-deco fd3">💫</div>
<div class="floating-deco fd4">🌟</div>
<div class="floating-deco fd5">⭐</div>
<div class="floating-deco fd6">✨</div>
<div class="floating-deco fd7">💫</div>
<div class="floating-deco fd8">🌟</div>

<!-- WELCOME -->
<div id="welcome" class="screen active">
  <div class="welcome-card">
    <div class="welcome-emoji">🎓</div>
    <div class="welcome-title">Πόσο καλά ξέρεις<br>την κυρία Τένια;</div>
    <div class="welcome-subtitle">Δ' Δημοτικού — 2025-2026</div>
    <input type="text" class="name-input" id="nameInput" placeholder="Γράψε το όνομά σου..." maxlength="20" autocomplete="off">
    <button class="btn-start" id="btnStart" disabled onclick="startQuiz()">ΠΑΜΕ! 🚀</button>
  </div>
</div>

<!-- QUIZ -->
<div id="quiz" class="screen">
  <div class="quiz-header">
    <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="progressFill"></div></div>
    <div class="quiz-counter" id="quizCounter">Ερώτηση 1/20</div>
  </div>
  <div class="quiz-card" id="quizCard">
    <div class="streak-badge" id="streakBadge">🔥 x3</div>
    <div class="question-emoji" id="questionEmoji">🎨</div>
    <div class="question-text" id="questionText"></div>
    <div class="options-grid" id="optionsGrid"></div>
  </div>
</div>

<!-- RESULTS -->
<div id="results" class="screen">
  <div class="results-card">
    <div class="results-emoji" id="resultsEmoji">🎉</div>
    <div class="results-title" id="resultsTitle">Μπράβο!</div>
    <div class="results-name" id="resultsName"></div>
    <div class="score-circle">
      <div class="score-number" id="scoreNumber">0</div>
      <div class="score-total">/ 20</div>
    </div>
    <div class="results-message" id="resultsMessage"></div>
    <div class="results-saved" id="resultsSaved"></div>
    <button class="btn-leaderboard" onclick="showScreen('leaderboard');loadLeaderboard()">🏆 Leaderboard</button>
  </div>
</div>

<!-- LEADERBOARD -->
<div id="leaderboard" class="screen">
  <div class="lb-header">
    <div class="lb-title">🏆 Ποιος ξέρει καλύτερα<br>την κυρία Τένια;</div>
    <div class="lb-subtitle">Δ' Δημοτικού — 2025-2026</div>
  </div>
  <div class="lb-list" id="lbList">
    <div class="lb-empty">Φορτώνω...</div>
  </div>
  <button class="btn-refresh" onclick="loadLeaderboard()">🔄 Ανανέωση</button>
  <button class="btn-back" onclick="showScreen('welcome');resetQuiz()">← Πίσω στο Quiz</button>
</div>

<div class="confetti-container" id="confettiContainer"></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBFtvhGowwf6IMkpG6LQ9wYaR7fOvpd--g",
  authDomain: "tenia-59242.firebaseapp.com",
  databaseURL: "https://tenia-59242-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tenia-59242",
  storageBucket: "tenia-59242.firebasestorage.app",
  messagingSenderId: "829289703157",
  appId: "1:829289703157:web:261c0191d60ddb9716c7bc"
};

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();

const QUESTIONS = [
  {q:"Ποιο είναι το αγαπημένο χρώμα της κυρίας Τένιας;",emoji:"🎨",opts:["Μπλε","Μωβ","Ροζ","Κίτρινο"],ans:"Ροζ"},
  {q:"Τι καφέ πίνει η κυρία Τένια;",emoji:"☕",opts:["Φραπέ","Freddo espresso","Freddo cappuccino","Iced latte"],ans:"Iced latte"},
  {q:"Ποιο είναι το αγαπημένο φαγητό της κυρίας Τένιας;",emoji:"😋",opts:["Πίτσα","Μακαρόνια","Κοτόπουλο","Σουβλάκι"],ans:"Κοτόπουλο"},
  {q:"Ποια εποχή του χρόνου αγαπάει η κυρία Τένια;",emoji:"🗓️",opts:["Καλοκαίρι","Άνοιξη","Φθινόπωρο","Χειμώνας"],ans:"Χειμώνας"},
  {q:"Ποιο μάθημα λατρεύει να διδάσκει;",emoji:"✏️",opts:["Γλώσσα","Μαθηματικά","Ιστορία","Γεωγραφία"],ans:"Μαθηματικά"},
  {q:"Τι φοβάται η κυρία Τένια;",emoji:"😱",opts:["Τις αράχνες","Τα φίδια","Τα ποντίκια","Το σκοτάδι"],ans:"Τα ποντίκια"},
  {q:"Ποιο είναι το αγαπημένο ζώο της κυρίας Τένιας;",emoji:"🐾",opts:["Γάτα","Σκύλος","Δελφίνι","Κουνέλι"],ans:"Σκύλος"},
  {q:"Πόσα αδέρφια έχει η κυρία Τένια;",emoji:"👨‍👩‍👧",opts:["Κανένα","1","2","3"],ans:"1"},
  {q:"Ποιο είναι το αγαπημένο σνακ της κυρίας Τένιας;",emoji:"🍿",opts:["Σοκολάτα","Πατατάκια","Γαριδάκια","Κρουασάν"],ans:"Γαριδάκια"},
  {q:"Αν μπορούσε να ταξιδέψει οπουδήποτε, πού θα πήγαινε;",emoji:"✈️",opts:["Παρίσι","Λονδίνο","Νέα Υόρκη","Σικάγο"],ans:"Σικάγο"},
  {q:"Ποια σειρά αγαπάει η κυρία Τένια;",emoji:"📺",opts:["Μην αρχίζεις τη μουρμούρα","Κωνσταντίνου και Ελένης","Παρά Πέντε","Ευτυχισμένοι Μαζί"],ans:"Ευτυχισμένοι Μαζί"},
  {q:"Τι λέει ΠΙΟ ΣΥΧΝΑ η κυρία Τένια στην τάξη;",emoji:"🗣️",opts:["«Σιωπή!»","«Ησυχία!!»","«Πάμε παιδιά!»","«Κάτσε κάτω!»"],ans:"«Ησυχία!!»"},
  {q:"Ποιον τραγουδιστή ακούει η κυρία Τένια;",emoji:"🎵",opts:["Ed Sheeran","Justin Bieber","Harry Styles","The Weeknd"],ans:"Harry Styles"},
  {q:"Τι αγαπάει να κάνει στο σχολείο με τα παιδιά;",emoji:"🏫",opts:["Πειράματα","Παιχνίδια","Εκδρομές","Διαγωνισμούς"],ans:"Εκδρομές"},
  {q:"Πόσα διαγωνίσματα κάνατε φέτος;",emoji:"📝",opts:["7","8","9","11"],ans:"9"},
  {q:"Ποιο είναι το superpower της κυρίας Τένιας;",emoji:"💪",opts:["Χιούμορ","Υπομονή","Αυστηρότητα","Ταχύτητα"],ans:"Υπομονή"},
  {q:"Έχει κατοικίδιο η κυρία Τένια;",emoji:"❓",opts:["Ναι, σκύλο","Ναι, γάτα","Όχι, δεν έχει","Ναι, χελώνα"],ans:"Όχι, δεν έχει"},
  {q:"Τι κάνει η κυρία Τένια στον ελεύθερο χρόνο της;",emoji:"⏰",opts:["Γυμναστική","Μαγειρική","Ταξίδια","Ταινίες & διάβασμα"],ans:"Ταινίες & διάβασμα"},
  {q:"Τι ΔΕΝ αρέσει καθόλου στην κυρία Τένια;",emoji:"🙅‍♀️",opts:["Να μαγειρεύει","Να φωνάζει","Να ξυπνάει νωρίς","Τα μαθηματικά"],ans:"Να φωνάζει"},
  {q:"Ποια ήταν η πιο αξέχαστη στιγμή φέτος;",emoji:"🌟",opts:["Η γιορτή του σχολείου","Το τουρνουά","Η πεζοπορία & το πικνίκ","Η θεατρική παράσταση"],ans:"Η πεζοπορία & το πικνίκ"}
];

let playerName="",currentQ=0,score=0,streak=0,shuffled=[],answered=false;
const labels=["Α","Β","Γ","Δ"];

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const d=document.querySelectorAll('.floating-deco');
  if(id==='leaderboard')d.forEach(x=>x.style.display='none');
  else d.forEach(x=>x.style.display='block');
}

function startQuiz(){
  playerName=document.getElementById('nameInput').value.trim();
  if(!playerName)return;
  shuffled=shuffle(QUESTIONS).map(q=>({...q,opts:shuffle(q.opts)}));
  currentQ=0;score=0;streak=0;
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion(){
  const q=shuffled[currentQ],total=shuffled.length,card=document.getElementById('quizCard');
  document.getElementById('progressFill').style.width=((currentQ)/total*100)+'%';
  document.getElementById('quizCounter').textContent=`Ερώτηση ${currentQ+1}/${total}`;
  const badge=document.getElementById('streakBadge');
  if(streak>=3){badge.textContent=`🔥 x${streak}`;badge.classList.add('show')}
  else badge.classList.remove('show');
  card.classList.remove('slide-in');void card.offsetWidth;card.classList.add('slide-in');
  document.getElementById('questionEmoji').textContent=q.emoji;
  document.getElementById('questionText').textContent=q.q;
  const grid=document.getElementById('optionsGrid');
  grid.innerHTML='';answered=false;
  q.opts.forEach((opt,i)=>{
    const btn=document.createElement('button');
    btn.className='option-btn';
    btn.innerHTML=`<span class="option-label">${labels[i]}</span>${opt}`;
    btn.onclick=()=>selectAnswer(opt,btn);
    grid.appendChild(btn);
  });
}

function selectAnswer(selected,btnEl){
  if(answered)return;answered=true;
  const q=shuffled[currentQ],isCorrect=selected===q.ans;
  const allBtns=document.querySelectorAll('.option-btn');
  allBtns.forEach(b=>b.classList.add('disabled'));
  if(isCorrect){
    score++;streak++;btnEl.classList.add('correct');
    if(streak>=3){const badge=document.getElementById('streakBadge');badge.textContent=`🔥 x${streak}`;badge.classList.add('show')}
  }else{
    streak=0;btnEl.classList.add('wrong');
    document.getElementById('streakBadge').classList.remove('show');
    allBtns.forEach(b=>{if(b.textContent.includes(q.ans))b.classList.add('reveal')});
  }
  setTimeout(()=>{
    currentQ++;
    if(currentQ<shuffled.length)renderQuestion();
    else showResults();
  },1200);
}

function showResults(){
  const total=shuffled.length,pct=score/total;
  let emoji,title,msg;
  if(pct>=.9){emoji="🏆";title="ΦΟΒΕΡΟ!";msg="Με ξέρεις καλύτερα κι από μένα! Είσαι ο/η No.1!"}
  else if(pct>=.7){emoji="🌟";title="Μπράβο!";msg="Με ξέρεις πολύ καλά! Λίγο ακόμα και θα ήσουν τέλειος/α!"}
  else if(pct>=.5){emoji="💪";title="Καλά πας!";msg="Με ξέρεις αρκετά, αλλά υπάρχουν μυστικά που δεν έχεις μάθει ακόμα!"}
  else if(pct>=.25){emoji="🤔";title="Χμμμ...";msg="Μάλλον χρειάζεσαι λίγη βοήθεια! Κάτσε πιο κοντά μου φέτος!"}
  else{emoji="😂";title="Ωωω!";msg="Σίγουρα ήρθες στη σωστή τάξη; Δεν πειράζει, θα με μάθεις!"}
  document.getElementById('resultsEmoji').textContent=emoji;
  document.getElementById('resultsTitle').textContent=title;
  document.getElementById('resultsName').textContent=playerName;
  document.getElementById('scoreNumber').textContent=score;
  document.getElementById('resultsMessage').textContent=msg;
  document.getElementById('progressFill').style.width='100%';
  showScreen('results');
  if(pct>=.5)createConfetti();
  saveScore();
  document.getElementById('resultsSaved').textContent='✅ Τα αποτελέσματά σου αποθηκεύτηκαν!';
}

function saveScore(){
  db.ref('quiz-results').push({name:playerName,score:score,total:shuffled.length,timestamp:Date.now()});
}

function loadLeaderboard(){
  const list=document.getElementById('lbList');
  list.innerHTML='<div class="lb-empty">Φορτώνω...</div>';
  db.ref('quiz-results').orderByChild('score').once('value',snap=>{
    const entries=[];
    snap.forEach(child=>entries.push(child.val()));
    entries.sort((a,b)=>b.score-a.score||a.timestamp-b.timestamp);
    if(!entries.length){list.innerHTML='<div class="lb-empty">Κανείς δεν έχει παίξει ακόμα!</div>';return}
    const medals=["🥇","🥈","🥉"];
    list.innerHTML=entries.map((e,i)=>`
      <div class="lb-item" style="animation-delay:${i*.05}s">
        <div class="lb-rank">${medals[i]||(i+1)}</div>
        <div class="lb-name">${escHtml(e.name)}</div>
        <div class="lb-score">${e.score}/${e.total}</div>
      </div>`).join('');
  });
}

function createConfetti(){
  const c=document.getElementById('confettiContainer');c.innerHTML='';
  const cols=['#FF6B9D','#FFD93D','#1B8E6B','#FF78A5','#24B888','#fff','#E8558A'];
  for(let i=0;i<60;i++){
    const p=document.createElement('div');p.className='confetti-piece';
    p.style.left=Math.random()*100+'%';
    p.style.background=cols[Math.floor(Math.random()*cols.length)];
    p.style.width=(Math.random()*8+5)+'px';p.style.height=(Math.random()*8+5)+'px';
    p.style.borderRadius=Math.random()>.5?'50%':'2px';
    p.style.animationDuration=(Math.random()*2+2)+'s';
    p.style.animationDelay=(Math.random()*1.5)+'s';
    c.appendChild(p);
  }
  setTimeout(()=>{c.innerHTML=''},5000);
}

function resetQuiz(){
  currentQ=0;score=0;streak=0;
  document.getElementById('nameInput').value='';
  document.getElementById('btnStart').disabled=true;
  document.getElementById('progressFill').style.width='0%';
}

function escHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

const nameInput=document.getElementById('nameInput'),btnStart=document.getElementById('btnStart');
nameInput.addEventListener('input',()=>{btnStart.disabled=nameInput.value.trim().length===0});
nameInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&nameInput.value.trim())startQuiz()});

if(window.location.search.includes('leaderboard')){showScreen('leaderboard');loadLeaderboard()}
db.ref('quiz-results').on('value',()=>{if(document.getElementById('leaderboard').classList.contains('active'))loadLeaderboard()});
</script>
</body>
</html>
